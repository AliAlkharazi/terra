<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden; touch-action: none;
      background: radial-gradient(circle at 60% 30%, #223326 0%, #131f18 55%, #0a130e 100%);
    }
    canvas { display: block; }
    #frameCounter {
      position: fixed; top: 6px; left: 6px; z-index: 999;
      font-family: monospace; font-size: 11px; color: #8fa891;
      background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="frameCounter">frame: 0</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.166.1/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

window.addEventListener('error', (e) => {
  if (window.ReactNativeWebView) {
    window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'SCENE_ERROR', message: e.message, source: e.filename, line: e.lineno }));
  }
});
window.addEventListener('unhandledrejection', (e) => {
  if (window.ReactNativeWebView) {
    window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'SCENE_ERROR', message: 'Unhandled promise rejection: ' + (e.reason?.message || e.reason) }));
  }
});

// =====================================================================
// PALETTE — restrained: deep green world, dark wood/brass, warm parchment.
// Euro notes provide the only real color variety, as specified.
// =====================================================================
const PALETTE = {
  worldFog: 0x0e1a13,
  patchHealthy: 0x3f6b46,
  patchDry: 0x8a7a4a,
  patchDepleted: 0x4a4038,
  baseWood: 0x3a2c22,
  baseWoodTop: 0x4a3a2c,
  sign: 0x2c2018,
  signBrass: 0xb08d4f,
  coral: 0xd96c5f,
};

const NOTE_COLORS = { 5: 0x9a95a3, 10: 0xb23b3b, 20: 0x1f5fa8, 50: 0xd67e1f, 100: 0x2f7d4f, 200: 0xc9932e };
const NOTE_DENOMS = [200, 100, 50, 20, 10, 5];
const COIN_DENOMS = [2, 1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01];

function coinMaterialKind(denom) {
  if (denom >= 1) return 'silver';
  if (denom >= 0.1) return 'gold';
  return 'copper';
}
const COIN_COLORS = { silver: 0xc7c7cc, gold: 0xd4af37, copper: 0xb5691f };

// =====================================================================
// CANVAS-GENERATED TEXTURES — makes the notes read as real money
// without any external image assets. Cached per denomination.
// =====================================================================
const noteTextureCache = {};
function getNoteTexture(denom) {
  if (noteTextureCache[denom]) return noteTextureCache[denom];

  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  const color = '#' + NOTE_COLORS[denom].toString(16).padStart(6, '0');

  ctx.fillStyle = color;
  ctx.fillRect(0, 0, 256, 128);

  for (let i = 0; i < 300; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`;
    ctx.fillRect(Math.random() * 256, Math.random() * 128, 1.5, 1.5);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    const x = 24 + i * 20;
    ctx.beginPath();
    ctx.arc(x, 74, 9, Math.PI, 0);
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.94)';
  ctx.font = 'bold 46px Georgia, serif';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(denom), 14, 34);
  ctx.font = 'bold 22px Georgia, serif';
  ctx.fillText(String(denom), 256 - 54, 128 - 24);

  ctx.font = 'bold 20px Georgia, serif';
  ctx.fillText('€', 256 - 30, 30);

  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 3;
  ctx.strokeRect(4, 4, 248, 120);

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  noteTextureCache[denom] = tex;
  return tex;
}

let stripTextureCache = null;
function getStripTexture() {
  if (stripTextureCache) return stripTextureCache;
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#e9e2c9';
  ctx.fillRect(0, 0, 64, 64);
  for (let y = 0; y < 64; y += 4) {
    ctx.fillStyle = y % 8 === 0 ? 'rgba(90,80,60,0.35)' : 'rgba(90,80,60,0.12)';
    ctx.fillRect(0, y, 64, 1.5);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  stripTextureCache = tex;
  return tex;
}

function makeSignTexture(title, subtitle) {
  const c = document.createElement('canvas');
  c.width = 320; c.height = 160;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2c2018';
  ctx.fillRect(0, 0, 320, 160);
  ctx.strokeStyle = '#b08d4f';
  ctx.lineWidth = 4;
  ctx.strokeRect(6, 6, 308, 148);

  ctx.fillStyle = '#e8dcc0';
  ctx.textAlign = 'center';
  ctx.font = 'bold 30px -apple-system, Georgia, serif';
  ctx.fillText(title.toUpperCase(), 160, 70);
  ctx.font = '600 26px -apple-system, Georgia, serif';
  ctx.fillStyle = '#d4af37';
  ctx.fillText(subtitle, 160, 118);

  return new THREE.CanvasTexture(c);
}

// =====================================================================
// SCENE / CAMERA / RENDERER
// =====================================================================
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PALETTE.worldFog, 12, 26);

const FIXED_PITCH = Math.PI * 0.24;
const ORTHO_VIEW_SIZE = 6.6;
let camAngle = 0.55;

const aspect0 = window.innerWidth / window.innerHeight;
const camera = new THREE.OrthographicCamera(
  -ORTHO_VIEW_SIZE * aspect0, ORTHO_VIEW_SIZE * aspect0,
  ORTHO_VIEW_SIZE, -ORTHO_VIEW_SIZE,
  0.1, 100
);
const camDist = 15;
updateCameraPosition();

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xfff3d6, 0x1b2e24, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffdfa8, 1.35);
sun.position.set(7, 10, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;
sun.shadow.camera.bottom = -8;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 22;
sun.shadow.bias = -0.0015;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8fa891, 0.22);
fill.position.set(-5, 6, -4);
scene.add(fill);

function updateCameraPosition() {
  const horizontalDist = Math.cos(FIXED_PITCH) * camDist;
  const height = Math.sin(FIXED_PITCH) * camDist;
  camera.position.set(Math.cos(camAngle) * horizontalDist, height, Math.sin(camAngle) * horizontalDist);
  camera.lookAt(0, 0.3, 0);
}

// =====================================================================
// TERRAIN
// =====================================================================
function pseudoRandom(seed) {
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}
function makeIrregularShape(baseRadius, points, jitter, seed) {
  const shape = new THREE.Shape();
  for (let i = 0; i <= points; i++) {
    const a = (i / points) * Math.PI * 2;
    const r = baseRadius * (1 - jitter / 2 + pseudoRandom(seed + i) * jitter);
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (i === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
  }
  return shape;
}
function makePatch(radius, depth, topColor, seed) {
  const shape = makeIrregularShape(radius, 10, 0.22, seed);
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.02, bevelSegments: 2 });
  const topMat = new THREE.MeshStandardMaterial({ color: topColor, roughness: 0.9 });
  const sideMat = new THREE.MeshStandardMaterial({ color: 0x2a3a26, roughness: 1 });
  const mesh = new THREE.Mesh(geo, [topMat, sideMat]);
  mesh.rotation.x = -Math.PI / 2;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return { mesh, topMat };
}

const worldGroup = new THREE.Group();
scene.add(worldGroup);

const baseShape = makeIrregularShape(6.6, 14, 0.1, 99);
const baseGeo = new THREE.ExtrudeGeometry(baseShape, { depth: 0.55, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.04, bevelSegments: 2 });
const baseMat = new THREE.MeshStandardMaterial({ color: PALETTE.baseWoodTop, roughness: 0.85 });
const baseSideMat = new THREE.MeshStandardMaterial({ color: PALETTE.baseWood, roughness: 0.9 });
const baseMesh = new THREE.Mesh(baseGeo, [baseMat, baseSideMat]);
baseMesh.rotation.x = -Math.PI / 2;
baseMesh.position.y = -0.5;
baseMesh.receiveShadow = true;
worldGroup.add(baseMesh);

const groundShadow = new THREE.Mesh(
  new THREE.CircleGeometry(6.9, 48),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 })
);
groundShadow.rotation.x = -Math.PI / 2;
groundShadow.position.y = -1.1;
scene.add(groundShadow);

// =====================================================================
// MONEY PILE — a bound "brick" (efficient bulk stand-in) plus a few
// individually textured loose notes on top.
// =====================================================================
const dummy = new THREE.Object3D();

function amountToHeight(amount) {
  return 0.05 + Math.min(0.6, Math.log2(Math.max(0, amount) / 20 + 1) * 0.085);
}
function topDenomForAmount(amount) {
  if (amount >= 500) return 200;
  if (amount >= 150) return 100;
  if (amount >= 60) return 50;
  if (amount >= 25) return 20;
  if (amount >= 8) return 10;
  return 5;
}

function buildMoneyPile(parentGroup, seedOffset) {
  const brickGeo = new THREE.BoxGeometry(0.48, 1, 0.28);
  const stripTex = getStripTexture();
  const sideMat = new THREE.MeshStandardMaterial({ map: stripTex, roughness: 0.8 });
  const topMat = new THREE.MeshStandardMaterial({ color: 0xf0ead6, roughness: 0.6 });
  const brick = new THREE.Mesh(brickGeo, [sideMat, sideMat, topMat, topMat, sideMat, sideMat]);
  brick.castShadow = true;
  brick.receiveShadow = true;
  brick.scale.y = 0.001;
  brick.position.y = 0.0005;
  parentGroup.add(brick);

  const toppers = new THREE.Group();
  parentGroup.add(toppers);

  const looseNotes = [];
  for (let i = 0; i < 4; i++) {
    const geo = new THREE.BoxGeometry(0.42, 0.01, 0.22);
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55 });
    const note = new THREE.Mesh(geo, mat);
    note.castShadow = true;
    note.receiveShadow = true;
    const jitter = seedOffset + i;
    note.position.set((pseudoRandom(jitter) - 0.5) * 0.06, i * 0.011, (pseudoRandom(jitter + 5) - 0.5) * 0.04);
    note.rotation.y = (pseudoRandom(jitter + 10) - 0.5) * 0.5;
    toppers.add(note);
    looseNotes.push(note);
  }

  return { brick, toppers, looseNotes, currentHeight: 0.001 };
}

function updateMoneyPile(pile, amount, animate) {
  const targetHeight = amountToHeight(amount);
  const topDenom = topDenomForAmount(amount);
  const tex = getNoteTexture(topDenom);

  pile.brick.material[2].map = tex;
  pile.brick.material[2].needsUpdate = true;
  pile.looseNotes.forEach((n) => {
    n.material.map = tex;
    n.material.needsUpdate = true;
  });

  const applyHeight = (h) => {
    pile.brick.scale.y = Math.max(0.02, h);
    pile.brick.position.y = pile.brick.scale.y * 0.5;
    pile.toppers.position.y = pile.brick.scale.y + 0.005;
    pile.currentHeight = h;
  };

  if (animate && window.gsap) {
    gsap.to(pile, { currentHeight: targetHeight, duration: 0.6, ease: 'power2.out', onUpdate: () => applyHeight(pile.currentHeight) });
  } else {
    applyHeight(targetHeight);
  }
}

// =====================================================================
// COINS — instanced across the whole scene.
// =====================================================================
const COIN_MAX = 96;
const coinGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.016, 14);
const coinMeshes = {};
for (const kind of ['silver', 'gold', 'copper']) {
  const mat = new THREE.MeshStandardMaterial({ color: COIN_COLORS[kind], roughness: 0.35, metalness: 0.5 });
  const mesh = new THREE.InstancedMesh(coinGeo, mat, COIN_MAX);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.count = 0;
  worldGroup.add(mesh);
  coinMeshes[kind] = mesh;
}

function rebuildAllCoins(pileList) {
  const counters = { silver: 0, gold: 0, copper: 0 };
  for (const pile of pileList) {
    const coinCount = Math.min(8, Math.max(2, Math.round(pile.amount / 80)));
    for (let i = 0; i < coinCount; i++) {
      const denom = COIN_DENOMS[i % COIN_DENOMS.length];
      const kind = coinMaterialKind(denom);
      const idx = counters[kind]++;
      if (idx >= COIN_MAX) continue;
      const angle = (i / coinCount) * Math.PI * 2 + pile.seed;
      const r = 0.14 + pseudoRandom(pile.seed + i) * 0.05;
      dummy.position.set(
        pile.group.position.x + pile.coinAnchorX + Math.cos(angle) * r,
        0.009 + Math.floor(i / 4) * 0.017,
        pile.group.position.z + pile.coinAnchorZ + Math.sin(angle) * r
      );
      dummy.rotation.set(0, pseudoRandom(pile.seed + i + 3) * Math.PI, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      coinMeshes[kind].setMatrixAt(idx, dummy.matrix);
    }
  }
  for (const kind of ['silver', 'gold', 'copper']) {
    coinMeshes[kind].count = counters[kind];
    coinMeshes[kind].instanceMatrix.needsUpdate = true;
  }
}

// =====================================================================
// SIGNS
// =====================================================================
function makeSign(title, subtitle, small) {
  const group = new THREE.Group();
  const scale = small ? 0.8 : 1;

  const postGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.22 * scale, 8);
  const postMat = new THREE.MeshStandardMaterial({ color: PALETTE.sign, roughness: 0.8 });
  const post = new THREE.Mesh(postGeo, postMat);
  post.position.y = 0.11 * scale;
  post.castShadow = true;
  group.add(post);

  const plaqueGeo = new THREE.PlaneGeometry(0.34 * scale, 0.17 * scale);
  const tex = makeSignTexture(title, subtitle);
  const plaqueMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 });
  const plaque = new THREE.Mesh(plaqueGeo, plaqueMat);
  plaque.position.y = 0.24 * scale;
  plaque.castShadow = true;
  group.add(plaque);

  group.userData.updateText = (t, s) => {
    plaqueMat.map = makeSignTexture(t, s);
    plaqueMat.needsUpdate = true;
  };

  return group;
}

// =====================================================================
// DISTRICT PILES
// =====================================================================
let piles = [];
let vault = null;

function buildCity(districts) {
  for (const p of piles) worldGroup.remove(p.group);
  piles = [];

  const count = districts.length;
  districts.forEach((d, i) => {
    const angle = (i / count) * Math.PI * 2;
    const radiusJitter = 1 + (pseudoRandom(i * 3.1) - 0.5) * 0.12;
    const radius = 3.7 * radiusJitter;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;

    const group = new THREE.Group();
    group.position.set(x, 0, z);
    group.lookAt(0, 0, 0);

    const { mesh: patchMesh, topMat } = makePatch(1.05, 0.22, PALETTE.patchHealthy, i * 7.3);
    patchMesh.position.y = -0.05;
    group.add(patchMesh);

    const pileAnchor = new THREE.Group();
    pileAnchor.position.y = 0.06;
    group.add(pileAnchor);
    const pile = buildMoneyPile(pileAnchor, i * 11.7);

    const sign = makeSign(d.label, '€0', true);
    sign.position.set(-0.55, 0.06, 0.35);
    sign.rotation.y = 0.4;
    group.add(sign);

    worldGroup.add(group);

    piles.push({
      districtId: d.id,
      group, patchMesh, topMat, pile, sign,
      seed: i * 11.7,
      coinAnchorX: 0.32, coinAnchorZ: 0.05,
      amount: d.monthlyBudget || 0,
      healthPct: 100,
      label: d.label,
    });
  });

  buildVault();
  refreshAllPiles(false);
}

function buildVault() {
  if (vault) worldGroup.remove(vault.group);

  const group = new THREE.Group();
  group.position.set(0, 0, 0);

  const { mesh: patchMesh } = makePatch(1.5, 0.24, PALETTE.patchHealthy, 500);
  patchMesh.position.y = -0.05;
  group.add(patchMesh);

  const pileAnchor = new THREE.Group();
  pileAnchor.position.y = 0.07;
  group.add(pileAnchor);
  const pile = buildMoneyPile(pileAnchor, 500);
  pile.brick.scale.set(1.6, pile.brick.scale.y, 1.6);

  const sign = makeSign('AVAILABLE', '€0', false);
  sign.position.set(0, 0.07, 0.75);
  group.add(sign);

  worldGroup.add(group);
  vault = { group, pile, sign, coinAnchorX: 0, coinAnchorZ: 0.4, seed: 500, amount: 0 };
}

function healthColor(healthPct) {
  const healthy = new THREE.Color(PALETTE.patchHealthy);
  const dry = new THREE.Color(PALETTE.patchDry);
  const depleted = new THREE.Color(PALETTE.patchDepleted);
  if (healthPct >= 60) {
    const t = 1 - Math.min(1, (healthPct - 60) / 40);
    return healthy.clone().lerp(dry, t * 0.25);
  }
  const t = Math.max(0, Math.min(1, (60 - healthPct) / 60));
  return dry.clone().lerp(depleted, t);
}

function applyHealth(states) {
  for (const p of piles) {
    const s = states.find((x) => x.districtId === p.districtId);
    if (!s) continue;
    p.healthPct = s.healthPct;
    p.amount = s.budget;
    p.topMat.color.copy(healthColor(s.healthPct));
  }
  refreshAllPiles(true);
}

function refreshAllPiles(animate) {
  for (const p of piles) {
    updateMoneyPile(p.pile, p.amount, animate);
    p.sign.userData.updateText(p.label, '€' + Math.round(p.amount));
  }
  if (vault) {
    updateMoneyPile(vault.pile, vault.amount, animate);
    vault.sign.userData.updateText('AVAILABLE', '€' + Math.round(vault.amount));
  }
  rebuildAllCoins([...piles, vault].filter(Boolean));
}

// =====================================================================
// TRANSACTION ANIMATIONS — real money moves instead of particle bursts.
// =====================================================================
function flyNote(fromWorldPos, toWorldPos, denom, onLand) {
  const tex = getNoteTexture(denom);
  const geo = new THREE.BoxGeometry(0.4, 0.01, 0.2);
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.55 });
  const note = new THREE.Mesh(geo, mat);
  note.position.copy(fromWorldPos);
  note.castShadow = true;
  scene.add(note);

  const midPoint = fromWorldPos.clone().lerp(toWorldPos, 0.5);
  midPoint.y += 1.4;

  if (!window.gsap) {
    note.position.copy(toWorldPos);
    scene.remove(note);
    onLand && onLand();
    return;
  }

  const path = { t: 0 };
  gsap.to(path, {
    t: 1,
    duration: 0.9,
    ease: 'power1.inOut',
    onUpdate: () => {
      const t = path.t;
      const a = fromWorldPos.clone().lerp(midPoint, t);
      const b = midPoint.clone().lerp(toWorldPos, t);
      note.position.copy(a.lerp(b, t));
      note.rotation.y = t * Math.PI * 1.5;
      note.rotation.x = Math.sin(t * Math.PI) * 0.3;
    },
    onComplete: () => {
      scene.remove(note);
      onLand && onLand();
    },
  });
}

function bumpPile(pile) {
  if (!window.gsap) return;
  gsap.fromTo(pile.pile.brick.scale, { x: 1.15, z: 1.15 }, { x: 1, z: 1, duration: 0.35, ease: 'elastic.out(1, 0.5)' });
}

function triggerSpend(districtId, amount) {
  const p = piles.find((x) => x.districtId === districtId);
  if (!p || !vault) return;
  const fromPos = new THREE.Vector3();
  vault.group.getWorldPosition(fromPos);
  fromPos.y += 0.5;
  const toPos = new THREE.Vector3();
  p.group.getWorldPosition(toPos);
  toPos.y += 0.3;

  const denom = topDenomForAmount(amount || p.amount || 20);
  flyNote(fromPos, toPos, denom, () => bumpPile(p));
}

function triggerSave(amount) {
  if (!vault) return;
  const fromPos = new THREE.Vector3(6, 3, -6);
  const toPos = new THREE.Vector3();
  vault.group.getWorldPosition(toPos);
  toPos.y += 0.4;

  const denom = topDenomForAmount(amount || 50);
  flyNote(fromPos, toPos, denom, () => bumpPile(vault));
}

// =====================================================================
// INTERACTION
// =====================================================================
let dragging = false;
let lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  lastX = e.clientX; lastY = e.clientY;
  camAngle -= dx * 0.006;
  updateCameraPosition();
});
window.addEventListener('pointerup', () => { dragging = false; });

let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', (e) => {
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved > 6) return;
  const ndc = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(piles.map((p) => p.group), true);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj.parent && !piles.some((p) => p.group === obj)) obj = obj.parent;
    const pile = piles.find((p) => p.group === obj);
    if (pile) {
      selectPile(pile);
      postToReactNative({ type: 'districtPress', districtId: pile.districtId });
    }
  }
});

function selectPile(pile) {
  if (!window.gsap) return;
  gsap.to(pile.group.position, { y: 0.12, duration: 0.25, ease: 'power2.out', yoyo: true, repeat: 1 });
}

function postToReactNative(payload) {
  if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(payload));
}

// =====================================================================
// BRIDGE — signatures preserved exactly; amount is an optional extra
// argument React Native may now pass for better animations.
// =====================================================================
window.terraSetDistricts = function (districtsJson) { buildCity(JSON.parse(districtsJson)); };
window.terraSetHealth = function (statesJson) { applyHealth(JSON.parse(statesJson)); };
window.terraSetBank = function (bankJson) {
  const bank = JSON.parse(bankJson);
  if (!vault) return;
  vault.amount = bank.totalSaved || 0;
  refreshAllPiles(true);
};
window.terraTriggerSpend = function (districtId, amount) { triggerSpend(districtId, amount); };
window.terraTriggerSave = function (amount) { triggerSave(amount); };

window.addEventListener('resize', () => {
  const newAspect = window.innerWidth / window.innerHeight;
  camera.left = -ORTHO_VIEW_SIZE * newAspect;
  camera.right = ORTHO_VIEW_SIZE * newAspect;
  camera.top = ORTHO_VIEW_SIZE;
  camera.bottom = -ORTHO_VIEW_SIZE;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// =====================================================================
// RENDER LOOP — mostly still by design; no continuous bob/spin/particles.
// =====================================================================
let frameCount = 0;
const frameCounterEl = document.getElementById('frameCounter');
function animate() {
  requestAnimationFrame(animate);
  frameCount++;
  if (frameCounterEl && frameCount % 10 === 0) frameCounterEl.textContent = 'frame: ' + frameCount;
  renderer.render(scene, camera);
}
animate();

postToReactNative({ type: 'SCENE_READY' });

// =====================================================================
// STANDALONE DEMO MODE
// =====================================================================
if (!window.ReactNativeWebView) {
  const DEMO_DISTRICTS = [
    { id: 'dining', label: 'Dining', monthlyBudget: 180 },
    { id: 'groceries', label: 'Groceries', monthlyBudget: 420 },
    { id: 'transport', label: 'Transport', monthlyBudget: 120 },
    { id: 'entertainment', label: 'Entertainment', monthlyBudget: 55 },
    { id: 'shopping', label: 'Shopping', monthlyBudget: 150 },
    { id: 'subscriptions', label: 'Subscriptions', monthlyBudget: 60 },
    { id: 'other', label: 'Savings', monthlyBudget: 1200 },
  ];
  const DEMO_HEALTH = [
    { districtId: 'dining', healthPct: 78, budget: 180 },
    { districtId: 'groceries', healthPct: 92, budget: 420 },
    { districtId: 'transport', healthPct: 65, budget: 120 },
    { districtId: 'entertainment', healthPct: 55, budget: 55 },
    { districtId: 'shopping', healthPct: 18, budget: 150 },
    { districtId: 'subscriptions', healthPct: 80, budget: 60 },
    { districtId: 'other', healthPct: 70, budget: 1200 },
  ];

  buildCity(DEMO_DISTRICTS);
  applyHealth(DEMO_HEALTH);
  window.terraSetBank(JSON.stringify({ totalSaved: 2430, floors: 4 }));

  setTimeout(() => triggerSpend('shopping', 47), 2200);
  setTimeout(() => triggerSave(50), 4200);
}
</script>
